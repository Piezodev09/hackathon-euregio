# Konfiguration der Plattform "Smart Bicycle Box" (nicht geheime Werte).
# Geheimnisse (Datenschlüssel, SMTP-Passwort) kommen AUSSCHLIESSLICH aus Umgebungsvariablen,
# siehe deploy/api.env.example.

[app]
# "development" oder "production". In production werden unsichere Einstellungen abgelehnt.
environment = "development"
# Öffentliche Basis-URL (für Links in E-Mails, Origin-Prüfung, Cookie-Sicherheit).
base_url = "http://127.0.0.1:8000"
# Erlaubte Host-Header (Schutz vor Host-Header-Angriffen). "*" nur in der Entwicklung.
allowed_hosts = ["127.0.0.1", "localhost"]
# Selbstregistrierung neuer Kunden erlauben.
signup_enabled = true
product_name = "Smart Bicycle Box"

[auth]
# Session: Leerlauf-Timeout und absolute Höchstdauer.
session_idle_minutes = 60
session_absolute_hours = 12
# Kontosperre nach so vielen Fehlversuchen (mit wachsender Sperrdauer).
lockout_threshold = 5
lockout_base_minutes = 5
password_min_length = 12
# scrypt-Kostenfaktor (2^15 empfohlen). Nur für Tests kleiner setzen (BIKE_SCRYPT_N).
scrypt_n = 32768
# Plattform-Admins müssen 2FA nutzen (in production immer erzwungen).
platform_admin_mfa_required = true
# Gültigkeit von E-Mail-Links (Stunden).
verify_token_hours = 48
reset_token_hours = 1
invite_token_hours = 72

[mail]
# "console" (Entwicklung: Mails im Log) oder "smtp".
backend = "console"
from = "Smart Bicycle Box <no-reply@example.org>"
smtp_host = ""
smtp_port = 587
smtp_user = ""
smtp_starttls = true

[timing]
# Ohne verlässliche Meldung seit so vielen Sekunden gilt ein Platz als "unbekannt".
stale_after_s = 30
ui_poll_interval_s = 2

[anomaly]
window_s = 10
peak_threshold = 300
min_peaks = 3
grace_period_s = 15
cooldown_s = 30
# Plattformweites, mit ml/train.py trainiertes Modell. Fehlt es, ist die KI "nicht verfügbar".
model_path = "../ml/models/vibration_iforest.joblib"

[retention]
# Audit-Log-Aufbewahrung (Tage). Messdaten-Aufbewahrung richtet sich nach dem Tarif.
audit_days = 365

[security]
# Ratenbegrenzung (Anfragen pro Sekunde, Burst) je Client-IP bzw. Gerät.
read_rate_per_s = 20
read_burst = 60
device_rate_per_s = 20
device_burst = 60
# Anmelde-/Registrierungs-Endpunkte je IP: so viele Versuche pro Minute.
auth_per_minute = 10
# Nur auf true setzen, wenn ein vertrauenswürdiger Reverse-Proxy X-Forwarded-For setzt.
trust_proxy = false
