<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Smart Bicycle Box</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/display.css">
  <script src="/static/js/display-i18n.js" defer></script>
  <script src="/static/js/display.js" defer></script>
</head>
<body class="sbb-root">
  <header class="top">
    <div>
      <h1 id="station-name">Smart Bicycle Box</h1>
      <p id="location" class="loc"></p>
    </div>
    <nav aria-label="Sprache / Taal / Language" class="lang">
      <button type="button" data-lang="de" lang="de">DE</button>
      <button type="button" data-lang="nl" lang="nl">NL</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </nav>
  </header>

  <main>
    <p id="invalid" class="invalid" hidden data-i18n="invalidLink">Dieser Anzeige-Link ist ungültig oder deaktiviert.</p>
    <div id="status" class="sbb-status" data-state="unknown">
      <span id="status-icon" aria-hidden="true"></span>
      <div>
        <p class="sbb-status__word" id="status-word">STATUS UNBEKANNT</p>
        <p class="sbb-status__sub" id="status-sub"></p>
      </div>
      <span id="simulated" class="sbb-status__corner sbb-tag sbb-tag--demo" hidden data-i18n="simulated">SIMULATION</span>
    </div>
    <p id="live" class="sbb-vh" aria-live="polite"></p>
    <div id="alert" class="alert" role="status"></div>
  </main>

  <footer>
    <p><span id="updated">–</span> · <span id="connection">–</span></p>
    <p data-i18n="privacy"></p>
  </footer>
</body>
</html>
