<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Smart Bicycle Box</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/public.css">
  <script type="module" src="/static/js/site.js"></script>
</head>
<body class="sbb-root site-display">
  <header class="site-top">
    <div>
      <h1 id="name">Smart Bicycle Box</h1>
      <p id="location" class="muted"></p>
    </div>
    <nav class="lang" aria-label="Sprache / Taal / Language">
      <button type="button" data-lang="de" lang="de">DE</button>
      <button type="button" data-lang="nl" lang="nl">NL</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </nav>
  </header>
  <main>
    <p id="invalid" class="note err" hidden data-i18n="invalid"></p>
    <section id="summary" class="site-summary" data-state="unknown" aria-live="polite">
      <span id="summary-icon" aria-hidden="true"></span>
      <p><span id="free-count" class="site-big">–</span> <span id="free-label" class="site-of"></span></p>
      <span id="sim" class="sbb-tag sbb-tag--demo" hidden data-i18n="simulated"></span>
    </section>
    <p id="conn" class="note warn" hidden data-i18n="connection"></p>
    <ul id="stalls" class="site-grid"></ul>
    <p id="wait" class="note info" hidden></p>
    <p class="muted small site-legend" data-i18n="legend"></p>
  </main>
</body>
</html>
