# Beispielkonfiguration des Pi-Gateways. Kopieren nach config.toml und anpassen.
# KEIN Token in diese Datei schreiben! Token über Umgebungsvariable BIKE_DEVICE_TOKEN
# (systemd: EnvironmentFile) oder über eine Datei mit Rechten 600 (api.token_file).

state_dir = "/var/lib/bike-gateway"

[api]
# Adresse der Debian-VM auf Proxmox. HTTPS für den Netzbetrieb (Plan 6).
url = "https://bike-vm.demo.lan:8443"
# Eigenes CA-Zertifikat, falls die VM ein selbst signiertes Zertifikat nutzt.
# ca_file = "/etc/bike-gateway/ca.crt"
# token_file = "/etc/bike-gateway/device-token"
timeout_s = 5

[station]
# Station = genau ein Stellplatz. ID aus dem Portal (Stationen -> Gateways).
id = "demo-01"

[serial]
# Portname vor Ort prüfen: ls /dev/ttyACM* /dev/ttyUSB*
# Benutzer muss in der Gruppe "dialout" sein.
port = "/dev/ttyACM0"
baudrate = 115200

[timing]
# Kommt so lange nichts vom Arduino, wird der Stellplatz als Sensorfehler (STATUS UNBEKANNT) gemeldet.
arduino_timeout_s = 15
# Wiederholung der Fehlermeldung bzw. erwarteter Arduino-Heartbeat.
heartbeat_s = 10

[buffer]
# Begrenzter Puffer bei Netzausfall (älteste Nachrichten fallen weg).
max_messages = 500
batch_size = 50
